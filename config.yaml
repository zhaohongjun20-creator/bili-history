  - "敦刻尔克大撤退：败军为何成为传奇"
  - "库尔斯克会战：史上最大坦克战"
  - "狼群战术：大西洋潜艇战的兴衰"
  - "伦敦空战：不列颠的至暗时刻"
  - "瓜岛争夺战：太平洋战争的转折点"
  - "巴巴罗萨行动：德军为何败于莫斯科城下"
  - "诺曼底登陆：史上最大两栖作战的欺骗艺术"
  # ↓ 2026-10-10 提频每日一发补充主题池
  - "莫斯科保卫战：严冬如何冻住闪电战"
  - "阿拉曼战役：沙漠之鼠的反击"
  - "珍珠港事件：偷袭为何未能决定胜负"
  - "柏林战役：第三帝国的最后十天"
  - "诺门坎战役：日本北进政策的终结"
  - "马奇诺防线：最坚固堡垒为何形同虚设"
  - "列宁格勒围城：872天的生存意志"
  - "西西里登陆：地中海的破门之战"
  - "阿登反击战：希特勒的最后一搏"
  - "夜袭塔兰托：航母时代的开端"
  - "缅甸远征军：野人山外的悲壮行军"
  - "市场花园行动：一桥太远的伞兵悲歌"
  - "莱特湾海战：史上最大规模的海战"
  - "冲绳战役：铁血台风下的最后登陆"
  - "喷火战斗机：不列颠的空中之盾"
  - "隆美尔：沙漠之狐的崛起与陨落"
  - "巴顿：铁血将军的战争哲学"
  - "零式战斗机：太平洋开局的空中神话"
  - "魏特曼与波卡基村：一辆虎式的奇迹冲锋"
  - "冬季战争：芬兰如何以寡敌众"

video:
  width: 1920
  height: 1080
  fps: 30
  sections_min: 12        # 讲稿段数范围（12-16段 ≈ 4-5分钟）
  sections_max: 16
  chars_per_section: [80, 130]   # 每段字数（约5字/秒 → 每段16-26秒）

transition:
  fade_seconds: 0.6       # 段落间转场时长（旁白说完画面停留后切换）
  styles:                  # 转场样式轮换池（相邻切换不重样，纪录片剪辑感）
    - fade                 # 交叉溶解（经典）
    - dissolve            # 颗粒溶解
    - wipeleft            # 左擦除
    - circleopen          # 圆形展开
    - fadeblack           # 黑场过渡（段落章节感）

narrator:
  backend: "edge"             # edge（免费微软音色）| zhipu（大模型 TTS，更自然，余额不足自动降级 edge）
  voice: "zh-CN-YunjianNeural"   # 云健：纪录片风格男声（音色池缺省时的兜底）
  voices:                     # 音色池：按天轮换（云泽在免费端点不可用，已换云曦）
    - "zh-CN-YunjianNeural"      # 云健：浑厚有力
    - "zh-CN-YunyangNeural"      # 云扬：新闻播音腔，字正腔圆
    - "zh-CN-YunxiNeural"        # 云曦：清亮青年声（备用：云端不可用时 narrator 自动熔断降级）
  rate: "+5%"
  cosy:                       # CosyVoice2 本地大模型（Apache-2.0；RTX 4070 GPU 推理，质量第一梯队）
    enable: true              # 失败自动降级 edge→熔断池→Piper 旧链，产线不断
    mode: "instruct2"         # 参考音频+风格指令（实测男声126Hz低沉纪录片腔，试听样片2号配方）
    prompt_wav: "repo/asset/cross_lingual_prompt.wav"
    instruct: "用低沉严肃的中文纪录片男声旁白解说"

subtitle:
  force_style: ""             # 留空用内置纪录片样式（白字黑边+轻阴影）；可填 libass force_style 覆盖

zhipu_tts:
  model: "cogtts"             # 智谱语音合成模型
  voice: "tongtong"           # 童童（女声）；API Key 复用 .env 的 ZHIPU_API_KEY

bgm_volume: 0.22        # 纪录片旁白为主，BGM 仅铺底

douyin:
  enable: false   # B站发布后自动分发抖音（登录态 data/douyin-state.json；失效时重跑 python douyin_bridge.py login 扫码）

bilibili:
  mid: 1518025639   # 数据回读用
  tid: 239              # 知识·人文历史（原 203 军事分区已被B站下线）
  tags_extra: ["军事历史", "二战", "纪录片", "历史科普"]

copywriter:
  model: "glm-4-flash"
  temperature: 0.7

bgm_dir: "bgm"          # 从 bili-autopost-sau 曲库复制，或自行扩充
